<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UT2Actividad2_04</title>
</head>
<body>
    <!-- Escribe un programa que ponga en práctica la siguiente lógica:
    • Mostrará el siguiente menú y el usuario deberá elegir una de las opciones:
    a) Área del triángulo (b*h/2)
    b) Área del rectángulo (b*h)
    c) Área del círculo (PI*r2)
    d) Salir
    • En función de la opción que elija el usuario, se le pedirán los datos necesarios en cada caso
    • El programa calculará el resultado y lo mostrará en la consola
    • La lógica anterior se repetirá indefinidamente hasta que el usuario pulse la tecla de Salir. -->

    <script>
        let $opcion = "";

        // Mejor hecho con do-while :((

        while ($opcion != "d") {
            $opcion = prompt("a) Área del triángulo (b*h/2)\nb) Área del rectángulo (b*h)\nc) Área del círculo (PI*r2)\nd) Salir\n\n¿Opción?");

            switch ($opcion) {
                case "a":
                    let $b_tri = parseInt(prompt("Base:"));
                    let $h_tri = parseInt(prompt("Altura:"));
                    let $a_tri = ($b_tri * $h_tri) / 2;

                    console.log(`Área del triángulo con base ${$b_tri} y altura ${$h_tri}: ${$a_tri}.`);

                    $opcion = "";
                    break;
                case "b":
                    let $b_rect = parseInt(prompt("Base:"));
                    let $h_rect = parseInt(prompt("Altura:"));
                    let $a_rect = $b_rect * $h_rect;

                    console.log(`Área del rectángulo con base ${$b_rect} y altura ${$h_rect}: ${$a_rect}.`);

                    $opcion = "";
                    break;
                case "c":
                    const PI = 3.1416;
                    let $r_circ = parseInt(prompt("Radio:"));
                    let $a_circ = PI * ($r_circ ** 2);

                    console.log(`Área del círculo con radio ${$r_circ}: ${$a_circ}.`);

                    $opcion = "";
            }
        }

        document.write("Adiós :))");
    </script>
</body>
</html>
