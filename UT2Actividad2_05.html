<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UT2Actividad2_05</title>
</head>
<body>
    <!-- Escribir un programa que calcule la suma de los números pares en un rango específico. -->

    <script>
        let $num_min = parseInt(prompt("¿Número mínimo?"));
        let $num_max = parseInt(prompt("¿Número máximo?"));
        let $contador = $num_min;
        let $sumatorio = 0;

        if ($num_min < $num_max) {
            document.write(`Suma de los números pares entre ${$num_min} y ${$num_max}: `);

            while ($contador <= $num_max) {
                if ($contador % 2 == 0) {
                    $sumatorio += $contador;
                }
                $contador++;
            }

            document.write(`${$sumatorio}.`);
        } else {
            document.write("Operación no realizable con los datos introducidos.");
        }
    </script>
</body>
</html>
