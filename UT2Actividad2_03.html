<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UT2Actividad2_03</title>
</head>
<body>
    <!-- Crea un programa que muestre los números impares que no sean múltiplos de 3 ni de 7 que hay del 100 al 1. Realiza versiones del programa usando bucles while, do while y for. -->

    <script>
        const INICIO = 1;
        const FIN = 100;

        document.write(`Operación con bucle WHILE:<br>`);
        let i = INICIO; while (i <= FIN) {
            if ((i % 2 != 0) && (i % 3 != 0) && (i % 7 != 0)) {
                document.write(`${i} `);
            }
            i++;
        }

        i = INICIO;
        document.write(`<br><br>Operación con bucle DO WHILE:<br>`);
        do {
            if ((i % 2 != 0) && (i % 3 != 0) && (i % 7 != 0)) {
                document.write(`${i} `);
            }
            i++;
        } while (i <= FIN);

        i = INICIO;
        document.write(`<br><br>Operación con bucle FOR:<br>`);
        for (i; i <= FIN; i++) {
            if ((i % 2 != 0) && (i % 3 != 0) && (i % 7 != 0)) {
                document.write(`${i} `);
            }
        }
    </script>
</body>
</html>
