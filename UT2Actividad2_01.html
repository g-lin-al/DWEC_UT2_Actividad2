<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UT2Actividad2_01</title>
</head>
<body>
    <!-- Escribe un programa que le pida al usuario un número, y muestre en consola su factorial. El factorial de un número entero n es una operación matemática que consiste en multiplicar todos los factores n x (n-1) x (n-2) x ... x 1. Así, el factorial de 5 (escrito como 5!) es igual a: 5! = 5 x 4 x 3 x 2 x 1 = 120. -->

    <script>
        let $num_1 = parseInt(prompt("¿Número?"));
        let $factorial = 1;

        for (let i = 1; i <= $num_1; i++){
            $factorial *= i;
        }

        document.write(`<h1>${$num_1}! = ${$factorial}</h1>`);
    </script>
</body>
</html>
